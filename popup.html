<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Mass Unfollow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LinkedIn Mass Unfollow</h1>
    <p>
      Open the
      <strong>Following</strong> page on LinkedIn and manage who you follow.
    </p>

    <div class="section">
      <div id="notFollowingMessage" style="display: none">
        <p>
          You are not on the Following page. Click below to open the correct
          page on LinkedIn.
        </p>
        <a href="#" id="goToFollowingLink" class="secondary">
          Go to the Following page
        </a>
      </div>
      <button id="loadUsersButton" class="secondary">
        Load users from current tab
      </button>
      <div id="status"></div>
    </div>

    <div class="section" style="margin-top: 10px">
      <div class="toolbar">
        <label>
          <input type="checkbox" id="selectAll" />
          <span>Select all</span>
        </label>
        <button id="unfollowSelectedButton" class="primary">
          Unfollow selected
        </button>
      </div>
      <div id="userListContainer">
        <div id="userList" style="font-size: 12px; color: #5f5f5f">
          No users loaded yet.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
