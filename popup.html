<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Mass Unfollow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LinkedIn Mass Unfollow</h1>
    <p>
      Open the
      <strong>Following</strong> page on LinkedIn and manage who you follow
      directly on that page.
    </p>

    <div class="section">
      <p style="margin-bottom: 8px">
        Click the button below to open the correct LinkedIn page. There you
        will see checkboxes and a control panel injected by this extension.
      </p>
      <button id="openFollowingButton" class="secondary">
        Open Following page
      </button>
      <div id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
