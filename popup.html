<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Mass Unfollow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LinkedIn Mass Unfollow</h1>
    <p>
      Abra a página de
      <strong>Following</strong> no LinkedIn e gerencie quem você segue.
    </p>

    <div class="section">
      <button id="loadUsersButton" class="secondary">
        Carregar usuários da aba atual
      </button>
      <div id="status"></div>
    </div>

    <div class="section" style="margin-top: 10px">
      <div class="toolbar">
        <label>
          <input type="checkbox" id="selectAll" />
          <span>Selecionar todos</span>
        </label>
        <button id="unfollowSelectedButton" class="primary">
          Unfollow selecionados
        </button>
      </div>
      <div id="userListContainer">
        <div id="userList" style="font-size: 12px; color: #5f5f5f">
          Nenhum usuário carregado ainda.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
