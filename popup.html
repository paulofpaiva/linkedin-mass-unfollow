<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Mass Unfollow</title>
    <style>
      body {
        margin: 0;
        padding: 12px 14px 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f3f2ef;
        color: #1d2226;
        min-width: 280px;
        max-width: 360px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        color: #0a66c2;
        font-weight: 600;
      }

      p {
        margin: 0 0 8px;
        font-size: 12px;
        color: #5f5f5f;
      }

      .section {
        margin-top: 8px;
        border-radius: 8px;
        background: #ffffff;
        padding: 8px 10px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04);
      }

      button {
        border: none;
        border-radius: 16px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-weight: 500;
        transition: background-color 0.12s ease, box-shadow 0.12s ease,
          transform 0.05s ease;
      }

      button.primary {
        background: #0a66c2;
        color: #ffffff;
      }

      button.primary:hover {
        background: #004182;
      }

      button.secondary {
        background: #e4f0fe;
        color: #0a66c2;
      }

      button.secondary:hover {
        background: #d0e3fd;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }

      #status {
        margin-top: 4px;
        font-size: 11px;
        color: #5f5f5f;
        min-height: 14px;
      }

      #userListContainer {
        max-height: 260px;
        overflow-y: auto;
        margin-top: 6px;
        padding-right: 2px;
      }

      .user-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        border-radius: 4px;
        font-size: 12px;
      }

      .user-row:nth-child(odd) {
        background: #fafafa;
      }

      .user-name {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .user-checkbox {
        flex-shrink: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 6px;
      }

      .toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: #5f5f5f;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Mass Unfollow</h1>
    <p>
      Abra a página de
      <strong>Following</strong> no LinkedIn e gerencie quem você segue.
    </p>

    <div class="section">
      <button id="loadUsersButton" class="secondary">
        Carregar usuários da aba atual
      </button>
      <div id="status"></div>
    </div>

    <div class="section" style="margin-top: 10px">
      <div class="toolbar">
        <label>
          <input type="checkbox" id="selectAll" />
          <span>Selecionar todos</span>
        </label>
        <button id="unfollowSelectedButton" class="primary">
          Unfollow selecionados
        </button>
      </div>
      <div id="userListContainer">
        <div id="userList" style="font-size: 12px; color: #5f5f5f">
          Nenhum usuário carregado ainda.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
